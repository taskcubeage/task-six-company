name: Sync Team Development to Company Development

on:
  push:
    branches:
      - development

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Team Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Add Company Remote
        run: |
          git remote add company https://x-access-token:${{ secrets.COMPANY_PAT }}@github.com/${{ secrets.COMPANY_REPO }}.git

      - name: Push to Company Repository
        run: |
          git push company development:development
